name: UX du site officiel Pict-au
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/site.js
      - run: node --test tests/site.test.mjs
      - name: Captures et contrôle géométrique des pages (FR et EN)
        run: node tests/browser.mjs
      - name: Captures écran unique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictau-ux-one-screen
          path: artifacts/vitrine/*.png
          if-no-files-found: warn
