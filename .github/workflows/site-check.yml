name: UX du site officiel Pict-au
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/site.js && node --check app/src/app.js && node --check app/src/admin-sheet-names.js && node --check app/src/image-adjustments.js && node --check app/src/bank-sheet-adjust.js
      - run: node --test tests/site.test.mjs tests/admin-bank-names.test.mjs tests/admin-bank-theme-copy.test.mjs
      - name: Émuler la fiche Banque sur Samsung, petit écran et tablette
        run: node tests/bank-hero-mobile.mjs
      - name: Captures de la fiche Banque
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictau-banque-hero-mobile
          path: artifacts/bank-hero/
          if-no-files-found: warn
      - name: Vrai parcours de fiche Banque avec session admin QA dans Chromium
        run: node tests/bank-real-app-mobile.mjs
      - name: Captures de l'app Banque chargée en conditions navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictau-banque-vraie-app-qa
          path: artifacts/admin-bank-real/
          if-no-files-found: warn
      - name: Captures et contrôle géométrique des pages (FR et EN)
        run: node tests/browser.mjs
      - name: Captures écran unique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictau-ux-one-screen
          path: artifacts/vitrine/*.png
          if-no-files-found: warn
