name: Pict-au — vitrine, responsive et accessibilité
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  site:
    name: Vitrine FR/EN — Chrome et 10 formats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la vitrine officielle
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe
        id: syntax
        run: |
          node --check src/site.js
          node --check tests/site.test.mjs
          node --check tests/browser.mjs
      - name: Vérifier les exigences du prompt maître
        id: static
        run: node --test tests/*.test.mjs
      - name: Captures réelles et contrôles UI dans Chrome
        id: browser
        run: node tests/browser.mjs
      - name: Conserver les captures en cas de succès ou d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictau-vitrine-ux-fr-en
          path: artifacts/vitrine/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Signaler le résultat du contrôle vitrine sur le commit
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = [
              '${{ steps.syntax.outcome }}',
              '${{ steps.static.outcome }}',
              '${{ steps.browser.outcome }}'
            ];
            const ok = results.every(value => value === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'pictau/vitrine-ux',
              description: ok
                ? 'Contrôles FR/EN, 10 formats, zoom et pages : réussis'
                : 'Vitrine : vérifications en échec, consulter GitHub Actions',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
