name: Pict-au — intégrité PNG et épreuves privées

on:
  pull_request:
    paths:
      - 'app/src/catalog.js'
      - 'app/src/admin-template-bank.js'
      - 'app/src/admin-template-bank-ui.js'
      - 'app/src/picto-template-choices.js'
      - 'app/src/picto-template-choices-ui.js'
      - 'app/src/client-template-print.js'
      - 'app/src/print-pdf.js'
      - 'app/tests/client-template-print.test.mjs'
      - 'app/tests/client-template-print-integration.test.mjs'
      - 'app/tests/client-template-paper.test.mjs'
      - 'app/tests/picto-template-modal-a11y.test.mjs'
      - 'app/tests/picto-template-choices.test.mjs'
      - 'app/tests/picto-template-choices-ui.test.mjs'
      - 'app/tests/admin-picto-template-integration.test.mjs'
      - 'app/tests/admin-template-bank.test.mjs'
      - 'app/tests/admin-template-bank-ui.test.mjs'
      - 'app/tests/admin-named-template-live-preview.test.mjs'
      - 'app/src/client-categories.js'
      - 'app/tests/client-categories.test.mjs'
      - 'app/src/app.js'
      - 'app/src/official-composer.js'
      - 'app/tests/catalog-board-navigation.test.mjs'
      - 'app/src/admin-proof.js'
      - 'app/src/admin-preview.js'
      - 'app/src/admin-artwork-rotation.js'
      - 'app/src/admin-import.js'
      - 'app/tests/admin-batch-import.test.mjs'
      - 'app/tests/admin-artwork-rotation.test.mjs app/tests/admin-batch-import.test.mjs'
      - 'app/tests/admin-private-proof.test.mjs app/tests/admin-artwork-rotation.test.mjs'
      - 'app/tests/catalog-publication.test.mjs'
      - '.github/workflows/catalog-publication-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/catalog.js'
      - 'app/src/admin-template-bank.js'
      - 'app/src/admin-template-bank-ui.js'
      - 'app/src/picto-template-choices.js'
      - 'app/src/picto-template-choices-ui.js'
      - 'app/src/client-template-print.js'
      - 'app/src/print-pdf.js'
      - 'app/tests/client-template-print.test.mjs'
      - 'app/tests/client-template-print-integration.test.mjs'
      - 'app/tests/client-template-paper.test.mjs'
      - 'app/tests/picto-template-modal-a11y.test.mjs'
      - 'app/tests/picto-template-choices.test.mjs'
      - 'app/tests/picto-template-choices-ui.test.mjs'
      - 'app/tests/admin-picto-template-integration.test.mjs'
      - 'app/tests/admin-template-bank.test.mjs'
      - 'app/tests/admin-template-bank-ui.test.mjs'
      - 'app/tests/admin-named-template-live-preview.test.mjs'
      - 'app/src/client-categories.js'
      - 'app/tests/client-categories.test.mjs'
      - 'app/src/app.js'
      - 'app/src/official-composer.js'
      - 'app/tests/catalog-board-navigation.test.mjs'
      - 'app/src/admin-proof.js'
      - 'app/src/admin-preview.js'
      - 'app/src/admin-artwork-rotation.js'
      - 'app/src/admin-import.js'
      - 'app/tests/admin-batch-import.test.mjs'
      - 'app/tests/admin-artwork-rotation.test.mjs'
      - 'app/tests/admin-private-proof.test.mjs'
      - 'app/tests/catalog-publication.test.mjs'
      - '.github/workflows/catalog-publication-integrity.yml'

permissions:
  contents: read

jobs:
  publication-integrity:
    name: Vérifier publication et épreuves privées
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests des modules publication et épreuve privée (sans Supabase réel)
        run: node --experimental-default-type=module --test app/tests/catalog-publication.test.mjs app/tests/admin-private-proof.test.mjs app/tests/catalog-board-navigation.test.mjs app/tests/client-categories.test.mjs app/tests/admin-template-bank.test.mjs app/tests/admin-template-bank-ui.test.mjs app/tests/admin-named-template-live-preview.test.mjs app/tests/picto-template-choices.test.mjs app/tests/picto-template-choices-ui.test.mjs app/tests/admin-picto-template-integration.test.mjs app/tests/client-template-print.test.mjs app/tests/client-template-print-integration.test.mjs app/tests/client-template-paper.test.mjs app/tests/picto-template-modal-a11y.test.mjs
